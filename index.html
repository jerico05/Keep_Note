<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>KeepNote — Notes rapides</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
        <div class="page-contenu">
            <h1>KeepNote</h1>
            <p class="subtitle">Prendre des notes rapides, localement et simplement</p>

            <div class="form-contenu">
                <textarea name="Titre" id="note-titre" placeholder="Titre"></textarea>
                <textarea name="Contenu" id="note-contenu" placeholder="Votre note ici..."></textarea>
                <div class="bouton-contenu">
                    <button id="bouton-enregistrer">Enregistrer</button>
                    <button id="bouton-historique">Mes notes</button>
                </div>
            </div>

            <div id="historique-contenu">
                
            </div>    
        </div>
		<script src="script.js" defer></script>
	</body>
</html>
